spring.application.name=supabase-api

# Datasource Configuration (Replace with your Supabase DB credentials)
spring.datasource.url=jdbc:postgresql://your-db-host:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=your-db-password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Configuration (Supabase JWT)
# Replace <your-project-ref> with your actual Supabase project reference
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<your-project-ref>.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://<your-project-ref>.supabase.co/auth/v1/.well-known/jwks.json

# If you use a symmetrical secret (HS256) instead of RS256, configuration is different.
# Supabase defaults to HS256 for older projects but supports RS256.
# The starter defaults to RS256 via jwk-set-uri usually.
# If Supabase uses HS256, we need to provide the secret.
# For now, we assume standard OIDC/OAuth2 resource server setup which often works with the JWK set if keys are exposed.
