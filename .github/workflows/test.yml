name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Unit Tests
      run: mvn -B test --file pom.xml

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Start Supabase
      run: |
        supabase init
        supabase start
      # This exposes Supabase ports on localhost (54321, 54322, etc.)

    - name: Build Docker Image
      run: docker build -t my-app .

    - name: Run App Container
      run: |
        docker run -d \
          --network host \
          -e SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:54322/postgres \
          -e SPRING_DATASOURCE_USERNAME=postgres \
          -e SPRING_DATASOURCE_PASSWORD=postgres \
          -e SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://127.0.0.1:54321/auth/v1 \
          -e SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://127.0.0.1:54321/auth/v1/.well-known/jwks.json \
          my-app
      # --network host allows the container to access 127.0.0.1 of the runner, where Supabase is listening.

    - name: Wait for App to Start
      run: |
        timeout 60s bash -c 'until curl -s http://localhost:8080/actuator/health > /dev/null || curl -s http://localhost:8080 > /dev/null || [ $? -eq 52 ]; do sleep 1; done' || true
        sleep 5 # Give it a bit more time

    - name: Run E2E Tests
      env:
        TEST_E2E: true
      run: |
        ANON_KEY=$(supabase status -o json | jq -r .anon_key)
        AUTH_URL="http://localhost:54321"
        mvn test -Dtest=E2EIntegrationTest -DSUPABASE_KEY=$ANON_KEY -DSUPABASE_URL=$AUTH_URL
